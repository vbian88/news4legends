services:

  news4legends-ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    image: news4legends-ui:local
    container_name: news4legends-ui
    restart: unless-stopped
    ports:
      - "${NEWS4LEGENDS_UI_PORT:-8081}:8080"
    volumes:
      - news4legends_data:/data
      - ${MAINTENANCE_REPORTS_DIR:-./maintenance/reports}:/security-reports:ro
    environment:
      NEWS4LEGENDS_DB_PATH: "/data/home-ai-news.db"
      NEWS4LEGENDS_REPORT_DIR: "/security-reports"
      NEWS4LEGENDS_WORKER_URL: "http://news4legends-worker:8080"
      NEWS4LEGENDS_COOKIE_SECURE: "${NEWS4LEGENDS_COOKIE_SECURE:-false}"
      TZ: "${TZ:-UTC}"
    depends_on:
      news4legends-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - news4legends-control

  news4legends-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: news4legends-worker:local
    container_name: news4legends-worker
    restart: unless-stopped
    volumes:
      - news4legends_data:/config:ro
      - news4legends_runtime:/data
      - ./config/collector.yaml:/config/collector.yaml:ro
    environment:
      TZ: "${TZ:-UTC}"
      OMNIROUTE_API_URL: "${LLM_API_URL}"
      OMNIROUTE_MODEL: "${LLM_MODEL}"
      OMNIROUTE_API_KEY: "${LLM_API_KEY:-}"
      LOG_DIR: "/data/logs"
      LOG_RETENTION_DAYS: "7"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - news4legends-control
      - news4legends-llm

  n8n:
    image: n8nio/n8n:latest
    container_name: news4legends-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-31002}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      TZ: "${TZ:-UTC}"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL}"
      WEBHOOK_URL: "${WEBHOOK_URL}"
    networks:
      - news4legends-control
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  news4legends_data:
  news4legends_runtime:
  n8n_data:

networks:
  news4legends-control:
  news4legends-llm:
