# News 4 Legends — generic collector defaults
#
# Profiles, topics, keywords, entities and sources are NOT configured here.
# They are managed through the News 4 Legends UI and stored in SQLite.

request:
  timeout_seconds: 15
  delay_seconds: 0.5
  user_agent: "News4Legends/1.0 (+self-hosted personal intelligence briefing)"

collection:
  max_articles_per_source: 10
  max_candidates_per_source: 40
  minimum_text_characters: 400
